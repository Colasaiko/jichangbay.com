# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: 2026机场推荐｜稳定便宜专线机场与VPN推荐｜机场湾
subtitle: 2026机场推荐｜稳定便宜专线机场与VPN推荐｜机场湾
description: '机场湾整理2026机场推荐、稳定机场推荐、便宜机场推荐与专线机场推荐，提供套餐价格、流量、优惠码、AI及流媒体支持，可按预算和流量快速筛选并查看购买入口。'
keywords: '机场推荐,2026机场推荐,稳定机场推荐,便宜机场推荐,专线机场推荐,VPN推荐,机场套餐,机场优惠码'
author: Colasaiko
language: zh-CN
timezone: ''

# URL
url: https://jichangbay.com
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: false
prismjs:
  enable: false

# Index generator
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Default category & tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: jichangbay

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: ''
lastUpdated: '2026-09-12'
