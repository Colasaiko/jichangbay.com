# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: 2026 机场推荐与 VPN 使用指南 | 机场湾 JichangBay
subtitle: '专业的中文用户机场与VPN推荐'
description: '2026年最新中文机场与VPN推荐、测速、评价。提供科学上网指南。'
keywords: '2026推荐机场,VPN推荐,科学上网,翻墙,机场评测'
author: Colasaiko
language: zh-CN
timezone: ''

# URL
url: https://jichangbay.com
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: false
prismjs:
  enable: false

# Index generator
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Default category & tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: jichangbay

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: ''
lastUpdated: "2026-09-07"
